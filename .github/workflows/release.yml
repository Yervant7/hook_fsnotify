name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Install Compiler
        run: |
          curl -o arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz

      - name: Extract version from source
        id: vars
        run: |
          VERSION=$(grep -Po 'KPM_VERSION\\("\\K[^\"]+' hook_fsnotify.c)
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build KPM
        run: |
          export PATH=`pwd`/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin:$PATH
          make

      - name: Create Release
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.vars.outputs.VERSION }}
          name: Release ${{ steps.vars.outputs.VERSION }}
          artifacts: hook_fsnotify.kpm
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true

